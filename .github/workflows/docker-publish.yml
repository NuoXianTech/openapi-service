name: Publish API service image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-service-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate manual publish ref
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/v*) ;;
            *)
              echo "Container publishing can only be dispatched from main or a version tag." >&2
              exit 1
              ;;
          esac

      - name: Verify version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Version tag $RELEASE_TAG does not point to a commit on main." >&2
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v${package_version}" ]]; then
            echo "Version tag $RELEASE_TAG does not match package.json version $package_version." >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check unused files and dependencies
        run: pnpm check:unused

      - name: Type-check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build production server
        run: pnpm build

  build:
    name: Build image (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read package version
        id: version
        shell: bash
        run: echo "value=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract architecture image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            suffix=-${{ matrix.arch }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            SERVICE_VERSION=${{ steps.version.outputs.value }}
            SERVICE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=openapi-service-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=openapi-service-${{ matrix.arch }}
          provenance: false
          sbom: false

  merge:
    name: Publish multi-platform image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract multi-platform image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create multi-platform manifests
        shell: bash
        env:
          IMAGE_TAGS_JSON: ${{ steps.metadata.outputs.json }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(jq -r '.tags[]' <<< "$IMAGE_TAGS_JSON")
          for tag in "${tags[@]}"; do
            docker buildx imagetools create \
              --tag "$tag" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done

      - name: Inspect published images
        shell: bash
        env:
          IMAGE_TAGS_JSON: ${{ steps.metadata.outputs.json }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            docker buildx imagetools inspect "$tag"
          done < <(jq -r '.tags[]' <<< "$IMAGE_TAGS_JSON")

  cleanup:
    name: Clean up stale container images
    needs: merge
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: ghcr-cleanup-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Delete untagged and legacy SHA images
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          owner: ${{ github.repository_owner }}
          package: ${{ github.event.repository.name }}
          delete-untagged: 'true'
          delete-tags: 'sha-*'
          validate: 'true'
