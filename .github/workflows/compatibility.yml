name: Service-Platform compatibility

on:
  schedule:
    - cron: '47 3 * * 1'
  workflow_dispatch:
    inputs:
      platform_ref:
        description: 'Optional Platform tag or commit to test instead of the latest release'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  service-platform:
    name: Service with latest Platform release
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out Service source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Service dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build Service
        run: pnpm build

      - name: Resolve Platform compatibility release
        id: platform-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.platform_ref }}
        run: |
          set -euo pipefail
          ref="$REQUESTED_REF"
          if [[ -z "$ref" ]]; then
            ref="$(gh api repos/NuoXianTech/openapi-platform/releases/latest --jq '.tag_name')"
          fi
          sha="$(gh api "repos/NuoXianTech/openapi-platform/commits/${ref}" --jq '.sha')"
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          echo "Testing Platform ref ${ref} (${sha})."

      - name: Check out Platform compatibility source
        uses: actions/checkout@v7
        with:
          repository: NuoXianTech/openapi-platform
          ref: ${{ steps.platform-release.outputs.sha }}
          path: openapi-platform
          persist-credentials: false

      - name: Install Platform dependencies
        working-directory: openapi-platform
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run Service-Platform acceptance suite
        working-directory: openapi-platform
        env:
          OPENAPI_SERVICE_REPO: ${{ github.workspace }}
        run: pnpm test:api-service

      - name: Publish compatibility summary
        if: always()
        shell: bash
        env:
          PLATFORM_REF: ${{ steps.platform-release.outputs.ref }}
          PLATFORM_SHA: ${{ steps.platform-release.outputs.sha }}
        run: |
          {
            echo "### Service-Platform compatibility"
            echo
            echo "- Service: `${GITHUB_SHA}`"
            echo "- Platform: `${PLATFORM_REF}` (`${PLATFORM_SHA}`)"
          } >> "$GITHUB_STEP_SUMMARY"
